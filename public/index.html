<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Supabase Keep-Alive</title>
  <style>
    body{font-family:system-ui,sans-serif;background:#0b0b0f;color:#e8e8ee;display:grid;place-items:center;min-height:100vh;margin:0}
    main{max-width:480px;padding:2rem;text-align:center}
    .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#2ecc71;margin-right:8px}
    p{color:#9a9aa8;line-height:1.6}
  </style>
</head>
<body>
  <main>
    <h1><span class="dot"></span>Keep-Alive Running</h1>
    <p>A scheduled function writes one row to each connected Supabase project every day and clears the previous one.</p>
  </main>
</body>
</html>
